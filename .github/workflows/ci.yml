name: Go CI

# All jobs run on the homelab ARC scale sets (cluster-middleware apps/arc-runners-emdexer*). Fork PRs are
# skipped: those runners carry the in-cluster build credentials, so only branches of this repo may use them.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-emdexer
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: src/pkg/go.mod

    - name: Tidy Go modules
      run: |
        for mod in src/pkg src/gateway src/node; do
          (cd "$mod" && go mod tidy)
        done

    - name: Build Emdexer Gateway
      run: cd src/gateway && go mod tidy && go build -v ./...

    - name: Build Emdexer Node
      run: cd src/node && go mod tidy && go build -v ./...

    - name: Run Integration Tests
      run: cd src/tests/integration && go test -v ./...
      continue-on-error: true

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-emdexer
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: src/pkg/go.mod

    - name: Tidy Go modules
      run: |
        for mod in src/pkg src/gateway src/node; do
          (cd "$mod" && go mod tidy)
        done

    - name: Install golangci-lint
      run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.3

    - name: Run golangci-lint on Gateway
      run: cd src/gateway && $(go env GOPATH)/bin/golangci-lint run ./...

    - name: Run golangci-lint on Node
      run: cd src/node && $(go env GOPATH)/bin/golangci-lint run ./...

    - name: Check compose env parity
      run: |
        chmod +x .github/scripts/check-compose-env-parity.sh
        .github/scripts/check-compose-env-parity.sh

    - name: Check metrics dashboard coverage
      run: |
        chmod +x .github/scripts/check-metrics-dashboards.sh
        .github/scripts/check-metrics-dashboards.sh
