name: Release

# Runs on the homelab ARC scale set (arc-emdexer). Only tag pushes trigger it, so fork PRs never reach it.

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'   # v1.2.0, v0.9.1-rc.1, etc.
      - '[0-9]*.[0-9]*.[0-9]*'     # 1.2.0, 0.9.1, etc.

permissions:
  contents: write
  packages: write

jobs:
  # ================================================================
  # DOCKER - Build and push versioned images to GHCR
  # Tagged: {version} (e.g. 1.2.0) + latest
  # ================================================================
  docker:
    name: Docker Images → GHCR
    runs-on: arc-emdexer
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            image_name: emdexer-gateway
            dockerfile: deploy/docker/Dockerfile.gateway
            build_context: .
          - service: node
            image_name: emdexer-node
            dockerfile: deploy/docker/Dockerfile.node
            build_context: .
          - service: mcp
            image_name: emdexer-mcp
            dockerfile: deploy/docker/Dockerfile.mcp
            build_context: .
          - service: plugin-sidecar
            image_name: emdexer-plugin-sidecar
            dockerfile: src/plugin-sidecar/Dockerfile
            build_context: src/plugin-sidecar
            build_contexts: plugins=plugins
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The ARC runner has no Docker daemon; build on the shared BuildKit (BUILDKIT_HOST, set on the runner pod).
      - name: Set up Buildx (remote BuildKit)
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkit.buildkit.svc.cluster.local:1234

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.build_context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts || '' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:latest

  # ================================================================
  # BINARIES - Cross-compiled Go binaries attached to GitHub Release
  # ================================================================
  binaries:
    name: Go Binaries
    runs-on: arc-emdexer
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/pkg/go.mod

      # The ARC runner image ships no build-essential.
      - name: Ensure make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends make; }

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT=$(git rev-parse --short HEAD)
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make all VERSION=$VERSION COMMIT=$COMMIT LICENSE_TYPE=Community

          mkdir -p dist
          mv bin/emdex dist/emdex-${{ matrix.goos }}-${{ matrix.goarch }}
          mv bin/emdex-gateway dist/emdex-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          mv bin/emdex-node dist/emdex-node-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  # ================================================================
  # HELM - Package and push charts to GHCR as OCI artifacts
  # Install: helm install oci://ghcr.io/{owner}/charts/emdexer-gateway --version 1.2.0
  # ================================================================
  helm:
    name: Helm Charts → GHCR
    needs: binaries
    runs-on: arc-emdexer
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Helm
        # Pinned to v4.2.0. Bump to next release once helm/helm#31964 merges
        # (fix: toPrettyJson HTML-escaping of &, <, > in chart templates)
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package and push charts
        run: |
          mkdir -p dist/charts
          VERSION="${{ steps.version.outputs.version }}"

          for chart in emdexer-gateway emdexer-node; do
            helm dependency build deploy/charts/$chart
            helm package deploy/charts/$chart --version $VERSION --app-version $VERSION -d dist/charts
          done

          helm push dist/charts/emdexer-gateway-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          helm push dist/charts/emdexer-node-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
