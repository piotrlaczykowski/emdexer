name: Security

# All jobs run on the homelab ARC scale sets (cluster-middleware apps/arc-runners-emdexer*). Fork PRs are
# skipped: those runners carry the in-cluster build credentials, so only branches of this repo may use them.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly scan on Monday midnight

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gosec:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-emdexer
    strategy:
      matrix:
        module: [src/gateway, src/node, src/pkg]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/pkg/go.mod
      - name: Tidy Go module
        run: cd ${{ matrix.module }} && go mod tidy
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run Gosec Security Scanner (${{ matrix.module }})
        run: gosec ./${{ matrix.module }}/...

  govulncheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-emdexer
    strategy:
      matrix:
        module: [src/gateway, src/node, src/pkg]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/pkg/go.mod
      - name: Tidy Go module
        run: cd ${{ matrix.module }} && go mod tidy
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (${{ matrix.module }})
        run: cd ${{ matrix.module }} && govulncheck ./...
