name: "Lint PR"

# Runs on the homelab ARC scale set. Safe for fork PRs too: pull_request_target runs this base-branch
# workflow and never checks out the PR's code, only its title is read.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

concurrency:
  # pull_request_target always runs on the base ref, so group per PR or every PR's check cancels the others.
  group: semantic-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: arc-emdexer
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
