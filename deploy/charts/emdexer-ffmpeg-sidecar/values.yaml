# Defaults for emdexer-ffmpeg-sidecar, rendered by the helm-framework library chart.
# Environment, ingress and volumes are set per deployment: for the homelab in cluster-middleware
# apps/emdexer/ffmpeg-sidecar.yaml, with the image tag pinned in apps/emdexer/image.yaml.
image:
  repository: harbor.k8s.laczyk.com/emdexer/ffmpeg-sidecar
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8004
  targetPort: 8004

healthChecks:
  enabled: true
  startupProbe:
    path: "/health"
    periodSeconds: 5
    failureThreshold: 60
    successThreshold: 1
    initialDelaySeconds: 5
    timeoutSeconds: 3
  livenessProbe:
    path: "/health"
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1
    initialDelaySeconds: 0
    timeoutSeconds: 3
  readinessProbe:
    path: "/health"
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    initialDelaySeconds: 0
    timeoutSeconds: 3

# The image runs as root (no USER in its Dockerfile).
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
