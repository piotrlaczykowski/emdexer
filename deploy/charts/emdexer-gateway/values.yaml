# Defaults for emdexer-gateway, rendered by the helm-framework library chart.
# Environment, ingress and volumes are set per deployment: for the homelab in cluster-middleware
# apps/emdexer/gateway.yaml, with the image tag pinned in apps/emdexer/image.yaml.
image:
  repository: harbor.k8s.laczyk.com/emdexer/gateway
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 7700
  targetPort: 7700

healthChecks:
  enabled: true
  startupProbe:
    path: "/healthz/startup"
    periodSeconds: 5
    failureThreshold: 60
    successThreshold: 1
    initialDelaySeconds: 5
    timeoutSeconds: 3
  livenessProbe:
    path: "/healthz/liveness"
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1
    initialDelaySeconds: 0
    timeoutSeconds: 3
  readinessProbe:
    path: "/healthz/readiness"
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    initialDelaySeconds: 0
    timeoutSeconds: 3

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
