# Defaults for emdexer-mcp, rendered by the helm-framework library chart.
# Environment, ingress and volumes are set per deployment: for the homelab in cluster-middleware
# apps/emdexer/mcp.yaml, with the image tag pinned in apps/emdexer/image.yaml.
image:
  repository: harbor.k8s.laczyk.com/emdexer/mcp
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8002
  targetPort: 8002

healthChecks:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
